<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Star Castle 2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="crtOverlay">
    <div id="scanlines"></div>
    <div id="vignette"></div>
  </div>

  <div id="attractScreen">
    <div id="attractContent">
      <h1>STAR CASTLE 2</h1>
      <p id="attractPrompt">PRESS FIRE TO PLAY</p>
      <p id="attractSub">&#9664; TURN LEFT &#9654; TURN RIGHT &#9650; THRUST &#9679; FIRE &bull; M MUTE</p>
      <p id="attractTouchHint">Mobile: LEFT / RIGHT buttons turn &bull; THRUST &bull; FIRE</p>
    </div>
  </div>

  <div id="deadOverlay">
    <div id="deadContent"></div>
  </div>

  <div id="hud">
    <div id="muteBtn" class="hud-btn" title="Mute/Unmute">MUTE</div>
  </div>

  <div id="touchControls">
    <div id="touchLeft" class="touch-btn">&#9664;</div>
    <div id="touchThrust" class="touch-btn">THRUST</div>
    <div id="touchRight" class="touch-btn">&#9654;</div>
    <div id="touchFire" class="touch-btn">FIRE</div>
  </div>

  <script src="game.js"></script>
</body>
</html>
